# Weights server (T-370 D4). Standalone nginx instance: own pid, bound to the PUBLIC IP only.
# Placeholders: __PUBLIC_IP__ __PORT__ (9443) __RATE__ (80m) __MODELS__ (/opt/models)
#   __AUTH__ (127.0.0.1:8096) __SEGMENTS__ (segments of self_hosted, default 1)
#   __LOGDIR__ __CERT__ __KEY__ __PID__ __TMP__ (writable dirs/files)
# Install / users / permissions / timeouts: deploy/README.md (unit runs as www-data; reads __MODELS__).
pid __PID__;
worker_processes 1;
worker_priority 10;
error_log __LOGDIR__/weights-error.log warn;
events { worker_connections 256; }

http {
    server_tokens off;
    # a stalled pod connection is dropped after 60 s without progress (the pod resumes by Range)
    send_timeout 60s;
    keepalive_timeout 15s;
    # No $request, $args, $request_uri or auth headers: tokens must never reach a log.
    log_format weights '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time op=$weights_op';
    log_format acct '$weights_op $body_bytes_sent $status';
    # The accounting log (volume cap) is written ONLY by the gguf location and only for 200/206
    # (SEC-2/SEC-4): error pages never charge an op, unauthenticated noise never grows it.
    map $status $acct_ok {
        "~^20[06]$" 1;
        default 0;
    }
    access_log __LOGDIR__/weights-access.log weights;
    client_body_temp_path __TMP__/body;
    proxy_temp_path __TMP__/proxy;
    fastcgi_temp_path __TMP__/fcgi;
    uwsgi_temp_path __TMP__/uwsgi;
    scgi_temp_path __TMP__/scgi;

    map $uri $weights_op {
        "~^/w/(?<o>[0-9a-f]{12})/" $o;
        default "";
    }
    limit_conn_zone $server_name zone=w_all:1m;
    limit_conn_zone $weights_op zone=w_op:1m;
    limit_req_zone $binary_remote_addr zone=w_req:1m rate=10r/s;
    # one Range per request: the validator charges exactly what nginx can send (SEC-1)
    max_ranges 1;

    server {
        listen __PUBLIC_IP__:__PORT__ ssl;
        ssl_certificate __CERT__;
        ssl_certificate_key __KEY__;
        ssl_protocols TLSv1.3;
        # server-level request rate for every location (the gguf location sets its own)
        limit_req zone=w_req burst=20 nodelay;

        location ~ "^/w/[0-9a-f]{12}/(?<rel>[a-z0-9][a-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*\.gguf)$" {
            limit_except GET { deny all; }
            auth_request /_auth;
            limit_conn w_all __SEGMENTS__;
            limit_conn w_op __SEGMENTS__;
            limit_conn_status 503;
            limit_rate __RATE__;
            limit_req zone=w_req burst=20 nodelay;
            access_log __LOGDIR__/weights-access.log weights;
            access_log __LOGDIR__/weights-acct.log acct if=$acct_ok;
            alias __MODELS__/$rel;
            disable_symlinks on;
            autoindex off;
            default_type application/octet-stream;
            add_header Cache-Control no-store;
        }

        location = /_auth {
            internal;
            proxy_pass http://__AUTH__/weights/auth;
            proxy_pass_request_body off;
            # a hanging validator must not hold the pod: fail fast (500) -> the pod goes to HF
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_set_header Content-Length "";
            # $uri would be "/_auth" inside the subrequest; the validator checks the RAW target and
            # rejects anything with %, '..', '//', '?' (a clean raw path equals the normalized one).
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Range $http_range;
            # If-Range (SEC-1): a mismatch turns Range into a full 200; the validator then
            # charges the whole file
            proxy_set_header X-If-Range $http_if_range;
        }

        location / { access_log off; return 404; }
    }
}
