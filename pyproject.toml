[project]
name = "llmhub"
dynamic = ["version"]
description = "Hybrid LLM dispatcher: local llama-server plus on-demand cloud GPU (ADR-0138)"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "httpx", "pydantic>=2", "pyyaml", "cryptography"]

[project.optional-dependencies]
mcp = ["mcp==2.2.0", "jsonschema>=4.20"]

[project.scripts]
llmhub-mcp = "llmhub.mcp_server.__main__:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "openai", "ruff", "pyright[nodejs]", "types-pyyaml", "mcp==2.2.0", "jsonschema>=4.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/llmhub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llmhub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long-running tests (simulator parity, subprocess reaper)",
    "docker: needs a local docker daemon (never run by default CI)",
]
pythonpath = ["infer-image"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pyright]
include = ["src", "tests", "infer-image"]
pythonVersion = "3.12"
extraPaths = ["tests", "infer-image"]
